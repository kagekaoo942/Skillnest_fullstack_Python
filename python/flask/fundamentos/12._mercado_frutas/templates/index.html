<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado de Frutas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
                <i class="bi bi-apple"></i> Mercado de Frutas
            </a>
            <div>
                <a class="nav-link text-white d-inline me-3" href="{{ url_for('index') }}">Inicio</a>
                <a class="nav-link text-white d-inline" href="{{ url_for('catalogo') }}">Catálogo</a>
            </div>
        </div>
    </nav>

    <!-- Encabezado Hero -->
    <header class="hero bg-secondary text-center text-white py-5">
        <div class="container">
            <h1 class="display-4 fw-bold">Frutas Frescas a Tu Puerta</h1>
            <p class="lead">Selecciona tus frutas favoritas y realiza tu pedido.</p>
        </div>
    </header>

    <!-- Formulario Principal -->
    <form action="{{ url_for('checkout') }}" method="POST">
        <div class="container my-5">
            <div class="row g-4">

                <!-- COLUMNA IZQUIERDA: Catálogo de Frutas (2 por fila) -->
                <div class="col-lg-8">
                    <div class="card shadow-sm">
                        <div class="card-header bg-white border-bottom-0 pt-3">
                            <h3 class="card-title fw-bold">Selecciona tus frutas</h3>
                        </div>
                        <div class="card-body">
                            <div class="row g-3">
                                {% for fruta in frutas %}
                                <div class="col-md-6 d-flex align-items-stretch">
                                    <div class="card fruta-card w-100 shadow-sm border-0 bg-light">
                                        <!-- Imagen de la fruta ajustada -->
                                        <div class="text-center p-3">
                                            <img src="{{ url_for('static', filename='images/' + fruta.imagen) }}"
                                                class="card-img-top img-fluid object-fit-contain"
                                                style="height: 140px; width: auto;" alt="{{ fruta.nombre }}">
                                        </div>
                                        <div class="card-body d-flex flex-column pt-0">
                                            <h5 class="card-title fw-bold mb-1">{{ fruta.nombre }}</h5>
                                            <h6 class="text-success fw-bold">${{ fruta.precio }}</h6>
                                            <p class="card-text text-muted small flex-grow-1">
                                                {{ fruta.descripcion }}
                                            </p>
                                        </div>
                                        <div class="card-footer bg-transparent border-0 pb-3">
                                            <input type="number" class="form-control text-center" min="0" value="0"
                                                name="{{ fruta.nombre }}">
                                        </div>
                                    </div>
                                </div>
                                {% endfor %}
                            </div>
                        </div>
                    </div>
                </div>

                <!-- COLUMNA DERECHA: Tarjeta de Contacto -->
                <div class="col-lg-4">
                    <div class="card shadow-sm" style="top: 20px;">
                        <div class="card-header bg-white border-bottom-0 pt-3">
                            <h3 class="card-title fw-bold">Información de Contacto</h3>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" name="nombre" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" name="email" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Dirección de entrega</label>
                                <textarea class="form-control" name="direccion" rows="3" required></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mt-2 fw-bold">
                                <i class="bi bi-cart-check"></i> Crear Orden
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </form>

</body>

</html>
