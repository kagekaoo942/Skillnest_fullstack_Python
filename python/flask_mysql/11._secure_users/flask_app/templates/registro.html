{% extends "base.html" %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <section class="card shadow">
            <div class="card-body p-4">
                <h1 class="mb-4">Crear nuevo usuario</h1>

                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div aria-live="polite">
                            {% for message in messages %}
                                <div class="alert alert-danger" role="alert">{{ message }}</div>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}

                <form action="{{ url_for('registrar') }}" method="POST">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input id="nombre" type="text" name="nombre" class="form-control" autocomplete="given-name" minlength="2" maxlength="100" required>
                    </div>

                    <div class="mb-3">
                        <label for="apellido" class="form-label">Apellido</label>
                        <input id="apellido" type="text" name="apellido" class="form-control" autocomplete="family-name" minlength="2" maxlength="100" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" type="email" name="email" class="form-control" autocomplete="email" maxlength="150" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input id="password" type="password" name="password" class="form-control" autocomplete="new-password" minlength="8" required aria-describedby="password-help">
                        <div id="password-help" class="form-text">Mínimo 8 caracteres.</div>
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-success">Crear usuario</button>
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">Volver</a>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>
{% endblock %}
