<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registro e inicio de sesión seguro con Flask.">
    <title>Secure Users{% if page_title %} | {{ page_title }}{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4" aria-label="Navegación principal">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">Secure Users</a>
        {% if session.get('usuario_id') %}
            <a href="{{ url_for('logout') }}" class="btn btn-outline-light">Cerrar sesión</a>
        {% endif %}
    </div>
</nav>

<main class="container pb-5">
    {% block contenido %}{% endblock %}
</main>
</body>
</html>
