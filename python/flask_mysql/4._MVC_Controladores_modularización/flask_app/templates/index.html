<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear taco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="form-card">
            <div class="d-flex justify-content-between align-items-center mb-4 page-heading">
                <div>
                    <h1>Crear taco</h1>
                    <p class="text-muted mb-0">Agrega una nueva combinación.</p>
                </div>
                <a href="{{ url_for('tacos') }}" class="btn btn-outline-success">Ver tacos</a>
            </div>
            {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
            <form action="{{ url_for('crear') }}" method="POST">
                <div class="mb-3"><label for="tortilla" class="form-label">Tortilla</label><input type="text" id="tortilla" name="tortilla" class="form-control" value="{{ datos.tortilla if datos else '' }}" required></div>
                <div class="mb-3"><label for="guiso" class="form-label">Guiso</label><input type="text" id="guiso" name="guiso" class="form-control" value="{{ datos.guiso if datos else '' }}" required></div>
                <div class="mb-4"><label for="salsa" class="form-label">Salsa</label><input type="text" id="salsa" name="salsa" class="form-control" value="{{ datos.salsa if datos else '' }}" required></div>
                <button type="submit" class="btn btn-primary">Crear taco</button>
            </form>
        </div>
    </main>
</body>
</html>
