<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del taco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <main class="container py-5">
        <section class="detail-card">
            <h1>Taco {{ taco.id }}</h1>
            <p class="text-muted">Detalle de la preparación.</p><hr>
            <p><strong>Tortilla:</strong> {{ taco.tortilla }}</p>
            <p><strong>Guiso:</strong> {{ taco.guiso }}</p>
            <p><strong>Salsa:</strong> {{ taco.salsa }}</p>
            <p><strong>Creado:</strong> {{ taco.created_at }}</p>
            <p><strong>Actualizado:</strong> {{ taco.updated_at }}</p>
            <div class="d-flex flex-wrap gap-2 mt-4">
                <a href="{{ url_for('editar', taco_id=taco.id) }}" class="btn btn-warning">Editar</a>
                <a href="{{ url_for('borrar', taco_id=taco.id) }}" class="btn btn-danger" onclick="return confirm('¿Estás seguro de eliminar este taco?');">Borrar</a>
                <a href="{{ url_for('tacos') }}" class="btn btn-outline-secondary">Todos los tacos</a>
            </div>
        </section>
    </main>
</body>
</html>
