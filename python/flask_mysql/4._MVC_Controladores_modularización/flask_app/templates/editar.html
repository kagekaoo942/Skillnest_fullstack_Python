<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar taco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="form-card">
            <h1>Editar taco {{ taco.id }}</h1>
            <p class="text-muted">Modifica sus ingredientes.</p>
            {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
            <form action="{{ url_for('actualizar', taco_id=taco.id) }}" method="POST">
                <div class="mb-3"><label for="tortilla" class="form-label">Tortilla</label><input type="text" id="tortilla" name="tortilla" class="form-control" value="{{ taco.tortilla }}" required></div>
                <div class="mb-3"><label for="guiso" class="form-label">Guiso</label><input type="text" id="guiso" name="guiso" class="form-control" value="{{ taco.guiso }}" required></div>
                <div class="mb-4"><label for="salsa" class="form-label">Salsa</label><input type="text" id="salsa" name="salsa" class="form-control" value="{{ taco.salsa }}" required></div>
                <div class="d-flex gap-2"><button type="submit" class="btn btn-success">Actualizar taco</button><a href="{{ url_for('detalle', taco_id=taco.id) }}" class="btn btn-outline-secondary">Cancelar</a></div>
            </form>
        </div>
    </main>
</body>
</html>
