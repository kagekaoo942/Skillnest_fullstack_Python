<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main class="container page-container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <section class="card user-card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <h1 class="page-title fw-bold mb-2">Crear nuevo usuario</h1>
                    <p class="text-muted mb-4">Completa la información del usuario.</p>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            <section class="flash-region" aria-label="Errores y notificaciones" aria-live="polite">
                                {% for category, message in messages %}
                                    <div class="alert {% if category in ['nombre', 'apellido', 'email', 'error'] %}alert-danger{% else %}alert-{{ category }}{% endif %}" role="alert" data-category="{{ category }}">{{ message }}</div>
                                {% endfor %}
                            </section>
                        {% endif %}
                    {% endwith %}

                    <form action="{{ url_for('crear_usuario') }}" method="POST">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" value="{{ datos_formulario.get('nombre', '') }}" maxlength="100" autocomplete="given-name" required>
                        </div>

                        <div class="mb-3">
                            <label for="apellido" class="form-label">Apellido</label>
                            <input type="text" id="apellido" name="apellido" class="form-control" value="{{ datos_formulario.get('apellido', '') }}" maxlength="100" autocomplete="family-name" required>
                        </div>

                        <div class="mb-4">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" id="email" name="email" class="form-control" value="{{ datos_formulario.get('email', '') }}" maxlength="100" autocomplete="email" required>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <button type="submit" class="btn btn-success">Crear</button>
                            <a href="{{ url_for('usuarios') }}" class="btn btn-outline-secondary">Volver</a>
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </div>
</main>
</body>
</html>
