<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario {{ usuario.id }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container py-5">
        <section class="detail-card">
            <h1>Usuario {{ usuario.id }}</h1>
            <p class="text-muted">Información completa del usuario.</p>
            <hr>
            <p><strong>Nombre completo:</strong> {{ usuario.nombre }} {{ usuario.apellido }}</p>
            <p><strong>E-mail:</strong> {{ usuario.email }}</p>
            <p><strong>Fecha de creación:</strong> {{ usuario.created_at }}</p>
            <p><strong>Fecha de actualización:</strong> {{ usuario.updated_at }}</p>
            <div class="d-flex gap-2 mt-4">
                <a href="{{ url_for('editar_usuario', user_id=usuario.id) }}" class="btn btn-warning">Editar</a>
                <a href="{{ url_for('borrar_usuario', user_id=usuario.id) }}" class="btn btn-danger">Borrar</a>
                <a href="{{ url_for('usuarios') }}" class="btn btn-outline-secondary">Volver</a>
            </div>
        </section>
    </main>
</body>
</html>
