<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar usuario {{ usuario.id }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="d-flex justify-content-between align-items-center mb-4 page-heading">
                    <div>
                        <h1 class="mb-1">Editar usuario</h1>
                        <p class="text-muted mb-0">Usuario {{ usuario.id }}</p>
                    </div>
                    <a href="{{ url_for('usuarios') }}" class="btn btn-outline-secondary">Volver</a>
                </div>

                <section class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        {% if error %}
                            <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}
                        <form action="{{ url_for('actualizar_usuario', user_id=usuario.id) }}" method="POST">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" id="nombre" name="nombre" class="form-control" maxlength="45" value="{{ usuario.nombre }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="apellido" class="form-label">Apellido</label>
                                <input type="text" id="apellido" name="apellido" class="form-control" maxlength="45" value="{{ usuario.apellido }}" required>
                            </div>
                            <div class="mb-4">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" id="email" name="email" class="form-control" maxlength="45" value="{{ usuario.email }}" required>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success">Actualizar</button>
                                <a href="{{ url_for('ver_usuario', user_id=usuario.id) }}" class="btn btn-outline-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
