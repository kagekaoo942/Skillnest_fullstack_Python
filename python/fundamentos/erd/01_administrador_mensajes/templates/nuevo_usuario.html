<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Usuario</title>
    <link rel="stylesheet" href="static/css/nuevo_usuario.css">
</head>
<body>

    <div class="form-container">
        <h2>Nuevo Usuario</h2>
        
        <form>
            <div class="form-row">
                <label for="new-name">Nombre</label>
                <input type="text" id="new-name">
            </div>
            
            <div class="form-row">
                <label for="new-email">E-mail</label>
                <input type="email" id="new-email">
            </div>
            
            <div class="form-row">
                <label for="new-pass">Contraseña</label>
                <input type="password" id="new-pass">
            </div>
            
            <div class="form-row">
                <label for="new-conf">Conf. Contraseña</label>
                <input type="password" id="new-conf">
            </div>
            
            <div class="form-row">
                <label for="new-role">Tipo de Usuario</label>
                <div class="select-wrapper">
                    <select id="new-role">
                        <option value="admin">Administrador</option>
                        <option value="user">Usuario</option>
                    </select>
                </div>
            </div>
            
            <div class="button-container">
                <button type="button" class="btn-black-border" onclick="location.href = 'editar_usuario.html'">Crear</button>
            </div>
        </form>
    </div>

</body>
</html>
