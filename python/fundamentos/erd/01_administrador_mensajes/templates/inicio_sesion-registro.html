<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio de Sesión y Registro</title>
    <link rel="stylesheet" href="static/css/inicio.css">
</head>
<body>

    <div class="container">
        
        <div class="column">
            <h2>Inicio de Sesión</h2>
            <form>
                <div class="form-row">
                    <label for="">E-mail</label>
                    <input type="email" id="login-email">
                </div>
                <div class="form-row">
                    <label for="">Contraseña</label>
                    <input type="password" id="login-pass">
                </div>
                <div class="button-container">
                    <button type="button" class="btn-black-border" onclick="location.href='dashboard-2.html'">Iniciar Sesión</button>
                </div>
            </form>
        </div>

        <div class="column">
            <h2>Registro</h2>
            <form>
                <div class="form-row">
                    <label for="">Nombre</label>
                    <input type="text" id="reg-name">
                </div>
                <div class="form-row">
                    <label for="">E-mail</label>
                    <input type="email" id="reg-email">
                </div>
                <div class="form-row">
                    <label for="">Contraseña</label>
                    <input type="password" id="reg-pass">
                </div>
                <div class="form-row">
                    <label for="">Conf. Contraseña</label>
                    <input type="password" id="reg-conf">
                </div>
                <div class="button-container">
                    <button type="button" class="btn-black-border" onclick="location.href = 'nuevo_usuario.html'">Registro</button>
                </div>
            </form>
        </div>

    </div>

</body>
</html>
