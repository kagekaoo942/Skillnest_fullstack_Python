<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Administración de cursos y estudiantes">
    <title>{% block title %}Estudiantes y Cursos{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=Literata:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar app-navbar" aria-label="Navegación principal">
        <div class="container app-container">
            <a class="navbar-brand" href="{{ url_for('cursos') }}">
                <span class="app-icon app-icon--book" aria-hidden="true"></span>
                <span>Estudiantes y Cursos</span>
            </a>
            <a class="nav-action" href="{{ url_for('nuevo_estudiante') }}">
                <span class="app-icon app-icon--student" aria-hidden="true"></span>
                <span>Nuevo estudiante</span>
            </a>
        </div>
    </nav>

    <main class="container app-container app-main py-4 py-lg-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <section class="flash-stack" aria-label="Mensajes" aria-live="polite">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                        </div>
                    {% endfor %}
                </section>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
