<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskTrack - Editar Categoría</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header class="topbar">
        <nav>
            <a class="brand" href="{{ url_for('tareas.dashboard') }}"><span class="brand-icon">✓</span>TaskTrack</a>
            <a href="{{ url_for('tareas.dashboard') }}">Mis Tareas</a>
            <a href="{{ url_for('categorias.listar') }}">Categorías</a>
            <a href="{{ url_for('auth.perfil') }}">Perfil</a>
        </nav>
    </header>
    <main class="page">
        <section class="form-card">
            <h1>Editar Categoría</h1>
            <form action="{{ url_for('categorias.actualizar', categoria_id=categoria.id) }}" method="post">
                <label for="nombre">Nombre</label>
                <input id="nombre" name="nombre" type="text" value="{{ categoria.nombre }}" required>
                <div class="form-actions">
                    <button type="submit">Actualizar</button>
                    <a href="{{ url_for('categorias.listar') }}">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
